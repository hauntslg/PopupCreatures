<!DOCTYPE html>
<html>
    <head>
        <style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
}

video {
    width: 100%;
    height: 100%;
}
        </style>
    </head>
    <body>
        <video id="player" muted playsinline>
            <source src="irashaimase-fade-alpha.webm" type="video/webm">
        </video>

        <script>
            const player = document.getElementById("player");

            chrome.webview.addEventListener("message", (event) => {
                if (event.data === "start") {
                    player.play().then(() => {
                        chrome.webview.postMessage("video-ready");
                    });
                }
            });

            player.addEventListener("ended", () => {
                chrome.webview.postMessage("finished");
            });
        </script>
    </body>
</html>
